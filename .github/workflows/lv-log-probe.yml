name: LV Log Probe
on:
  workflow_dispatch:
    inputs:
      confirm_writes:
        required: true
        default: "no"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Reachability of the production dependencies
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://nqxqisjtbfsratgztmch.supabase.co/rest/v1/" || echo ERR)
          echo "::error title=PROBE SB API::status=$code"
          auth=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://nqxqisjtbfsratgztmch.supabase.co/auth/v1/health" || echo ERR)
          echo "::error title=PROBE SB AUTH::status=$auth"
          # Does the deployed app serve its own assistant UI (proves the build)?
          ui=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 -L "https://evalora-edu.online/dashboard/ai" || echo ERR)
          echo "::error title=PROBE DASH::status=$ui"
          # No credentials at all must be refused, from a real network.
          noauth=$(curl -s -o /tmp/na.json -w "%{http_code}" --max-time 20 -X POST -H "Content-Type: application/json" -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' "https://evalora-edu.online/api/mcp" || echo ERR)
          echo "::error title=PROBE NOAUTH MCP::status=$noauth body=$(head -c 160 /tmp/na.json)"
