name: LV Log Probe
on:
  workflow_dispatch:
    inputs:
      confirm_writes:
        required: true
        default: "no"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Emit findings as annotations (annotations survive where logs do not)
        env:
          HAS_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' }}
          HAS_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: |
          echo "secrets url=$HAS_URL key=$HAS_KEY"
          echo "::error title=PROBE URL_SECRET::url_present=$HAS_URL"
          echo "::error title=PROBE KEY_SECRET::key_present=$HAS_KEY"
          app=$(curl -s -o /tmp/app.json -w "%{http_code}" --max-time 20 "https://evalora-edu.online/api/mcp" || echo ERR)
          server=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('/tmp/app.json','utf8')).server)}catch(e){console.log('unparseable')}")
          echo "::error title=PROBE APP::status=$app server=$server"
