name: Build and Publish EVALORA Secure Browser (Windows x64)

on:
  push:
    branches:
      - 'arena/**'
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach binaries to (leave blank to skip release upload or default to v1.1.0)'
        required: false
        default: 'v1.1.0'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Run Desktop security & attestation tests
        working-directory: desktop
        run: npm test

      - name: Build Windows NSIS installer
        working-directory: desktop
        shell: pwsh
        run: |
          npx electron-builder --win nsis --x64 --publish never

      - name: Compute SHA-256 Checksums
        shell: pwsh
        working-directory: desktop/dist
        run: |
          Get-ChildItem -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content "$($_.FullName).sha256" -Encoding ascii
          }
          Get-Content *.sha256

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EVALORA-Secure-Browser-Windows-x64
          path: |
            desktop/dist/*.exe
            desktop/dist/*.exe.sha256

      - name: Publish to GitHub Release
        shell: pwsh
        working-directory: desktop/dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.event.inputs.release_tag }}"
          if (-not $tag) {
            $tag = "v1.1.0"
          }
          Write-Host "Publishing assets to release tag: $tag"
          $files = Get-ChildItem -File | Where-Object { $_.Name -like "*.exe*" }
          Write-Host "Found files:"
          $files | ForEach-Object { Write-Host " - $($_.FullName) ($($_.Length) bytes)" }
          if ($files.Count -eq 0) {
            Write-Error "No installer files found in desktop/dist!"
            exit 1
          }
          foreach ($file in $files) {
            Write-Host "Uploading $($file.Name) to release $tag..."
            gh release upload $tag $file.FullName --clobber
          }
          Write-Host "Verification of assets on release $tag:"
          gh release view $tag
