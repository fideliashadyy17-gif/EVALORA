name: Build and Publish EVALORA Secure Browser (Windows x64)

on:
  push:
    branches:
      - 'arena/**'
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach binaries to (leave blank to skip release upload or default to v1.1.0)'
        required: false
        default: 'v1.1.0'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Run Desktop security & attestation tests
        working-directory: desktop
        run: npm test

      - name: Build Windows NSIS installer
        working-directory: desktop
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute SHA-256 Checksums
        shell: pwsh
        working-directory: desktop/dist
        run: |
          Get-ChildItem -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content "$($_.FullName).sha256" -Encoding ascii
          }
          Get-Content *.sha256

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EVALORA-Secure-Browser-Windows-x64
          path: |
            desktop/dist/*.exe
            desktop/dist/*.exe.sha256
            desktop/dist/latest.yml

      - name: Upload installer artifacts to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') || github.ref == 'refs/heads/arena/b09f356c-evalora'
        with:
          tag_name: ${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v1.1.0' }}
          files: |
            desktop/dist/*.exe
            desktop/dist/*.exe.sha256
            desktop/dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
