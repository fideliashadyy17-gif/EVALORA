name: Build and Publish EVALORA Secure Browser (Windows x64)

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Run Desktop security & attestation tests
        working-directory: desktop
        run: npm test

      - name: Build Windows NSIS installer
        working-directory: desktop
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute SHA-256 Checksums
        shell: pwsh
        working-directory: desktop/dist
        run: |
          Get-ChildItem -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content "$($_.FullName).sha256" -Encoding ascii
          }

      - name: Upload installer artifacts to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            desktop/dist/*.exe
            desktop/dist/*.exe.sha256
            desktop/dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
